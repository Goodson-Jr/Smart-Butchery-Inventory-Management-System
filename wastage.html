<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report Wastage · Smart Butchery IMS</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
        <div class="page-head">
            <h1>Report Wastage</h1>
            <p id="pageSubtitle">Tap a cut, then report the spoiled weight. A manager has to approve it before it comes off stock.</p>
        </div>

        <div id="productGrid" class="product-grid"></div>

        <div class="card">
            <div class="field">
                <label for="quantityInput">Quantity wasted (kg)</label>
                <input id="quantityInput" type="number" step="0.01" min="0" placeholder="e.g. 0.5">
            </div>
            <div class="field">
                <label for="reasonSelect">Reason</label>
                <select id="reasonSelect">
                    <option value="">Choose a reason</option>
                    <option value="SPOILAGE">Spoilage</option>
                    <option value="EXPIRY">Expired</option>
                    <option value="TRIM">Trim / offcuts</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>
            <div class="field">
                <label for="noteInput">Note (optional)</label>
                <input id="noteInput" type="text" maxlength="255" placeholder="e.g. smelled off, fridge 2 failed overnight">
            </div>
            <button type="button" class="btn danger" id="saveWastageButton">Report Wastage</button>
        </div>

        <h3>My recent reports</h3>
        <div class="card" id="myReports"><p class="muted">Loading…</p></div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/wastage.js"></script>
</body>
</html>
