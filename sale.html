<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Record Sale · Smart Butchery IMS</title>
    <link rel="stylesheet" href="css/app.css">
    <style>
        @media print {
            .sidebar, .no-print { display: none !important; }
            .shell { display: block !important; }
        }
    </style>
</head>
<body>
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">

        <div id="saleView">
            <div class="page-head">
                <h1>Record Sale</h1>
                <p>Tap a cut, enter the weight, add to cart</p>
            </div>

            <button type="button" class="btn dark" id="scanButton" style="margin-bottom: 16px;">Scan Barcode</button>

            <div id="productGrid" class="product-grid"></div>

            <div class="card" style="margin-bottom: 18px;">
                <div class="field">
                    <label for="weightInput">Weight sold (kg)</label>
                    <input id="weightInput" type="number" step="0.01" min="0" placeholder="e.g. 2.5">
                </div>
                <button type="button" class="btn soft" id="addToCartButton">Add to Cart</button>
            </div>

            <h3 style="margin: 0 0 8px;">Cart</h3>
            <div id="emptyCartText" class="muted">Cart is empty — tap a cut above to add one.</div>
            <div id="cartList" class="card" style="display: none;"></div>

            <div class="card" style="margin-top: 18px;">
                <div id="grandTotalText" style="font-size: 20px; font-weight: 700; margin-bottom: 14px;">Grand total: K0.00</div>
                <button type="button" class="btn" id="completeSaleButton" disabled>Complete Sale</button>
            </div>
        </div>

        <div id="receiptView" style="display: none;">
            <div class="page-head">
                <h1>Sale Complete</h1>
                <p id="receiptSubtitle"></p>
            </div>
            <div class="card">
                <div id="receiptLines"></div>
                <hr style="border: none; border-top: 1px solid var(--line); margin: 12px 0;">
                <div id="receiptTotal" style="font-size: 18px; font-weight: 700;"></div>
            </div>
            <div class="no-print" style="margin-top: 18px; display: flex; flex-direction: column; gap: 10px;">
                <button type="button" class="btn dark" onclick="window.print()">Print Receipt</button>
                <button type="button" class="btn soft" id="newSaleButton">New Sale</button>
            </div>
        </div>

    </main>
</div>

<div id="scanOverlay" class="modal-overlay" hidden>
    <div class="scan-modal">
        <div class="scan-head">
            <span>Point the camera at a barcode</span>
            <span class="close" onclick="closeScanModal()">&times;</span>
        </div>
        <div id="scanReader"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/barcode.js"></script>
<script src="js/sale.js"></script>
</body>
</html>
