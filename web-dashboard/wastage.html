<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Record Wastage · Smart Butchery IMS</title>
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
        <div class="page-head">
            <h1>Record Wastage</h1>
            <p>Tap a cut, then log the spoiled weight</p>
        </div>

        <div id="productGrid" class="product-grid"></div>

        <div class="card">
            <div class="field">
                <label for="quantityInput">Quantity wasted (kg)</label>
                <input id="quantityInput" type="number" step="0.01" min="0" placeholder="e.g. 0.5">
            </div>
            <div class="field">
                <label for="reasonInput">Reason (e.g. expired, spoiled)</label>
                <input id="reasonInput" type="text" placeholder="Reason">
            </div>
            <button type="button" class="btn danger" id="saveWastageButton">Log Wastage</button>
        </div>
    </main>
</div>

<script src="js/api.js"></script>
<script src="js/shell.js"></script>
<script src="js/wastage.js"></script>
</body>
</html>
